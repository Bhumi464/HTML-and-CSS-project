<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <form class="form">
        <h2>Create Account</h2>

        <label>Name</label>
        <input type="text" placeholder="Enter your name" required><br>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required><br>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number" required><br>

        <label>Password</label>
        <input type="password" placeholder="Create password" required><br>

        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter password" required><br>

        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="gender" value="Male">
            <label>Male</label>

            <input type="radio" name="gender" value="Female">
            <label>Female</label>

            <input type="radio" name="gender" value="Other">
            <label>Other</label>
        </div>

        <button type="submit"><a href="zepto.html">Sign Up</a></button>

        <p>Already have an account? <a href="login.html">Login</a></p>
    </form>
</body>
</html>
